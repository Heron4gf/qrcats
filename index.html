<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spot the Sick Cat</title>
  <style>
    :root {
      --bg: #eeeeee;
      --navy: #172243;
      --accent: #4b71c0;
      --red: #e21b3c;
      --blue: #4b71c0;
      --dark: #172243;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: var(--bg);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.1;
    }
    #timer {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
    }
    #answers {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .answer {
      flex: 1;
      min-height: 90px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      font-size: 1.8rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease;
    }
    .answer:active {
      transform: scale(0.97);
    }
    .answer svg {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      fill: #ffffff;
    }
    .red { background: var(--red); }
    .blue { background: var(--blue); }
    .dark { background: var(--dark); }
    @media (min-width: 768px) {
      h1 { font-size: 2.4rem; }
      #answers { flex-direction: row; }
      .answer { justify-content: center; }
    }
    #confirmation {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      color: #ffffff;
      margin: -16px;
      padding: 32px 16px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #confirmation svg {
      width: 96px;
      height: 96px;
      fill: #ffffff;
    }
    #confirmation h2 {
      font-size: 2rem;
      font-weight: 900;
    }
    #confirmation p {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header id="page-header">
    <h1>Which cat is sick?</h1>
    <div id="timer">60</div>
  </header>

  <div id="answers">
    <button class="answer red" onclick="submitVote('A', this)">
      <svg viewBox="0 0 100 100"><path d="M50 5 L95 90 L5 90 Z"/></svg>
      Cat A
    </button>
    <button class="answer blue" onclick="submitVote('B', this)">
      <svg viewBox="0 0 100 100"><path d="M50 0 L100 50 L50 100 L0 50 Z"/></svg>
      Cat B
    </button>
    <button class="answer dark" onclick="submitVote('C', this)">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>
      Cat C
    </button>
  </div>

  <div id="confirmation">
    <div id="chosen-icon"></div>
    <h2>Answer locked in!</h2>
    <p>Look at the main screen for the reveal 👀</p>
  </div>

  <script>
    let timeLeft = 60;
    const timerEl = document.getElementById('timer');
    const answersEl = document.getElementById('answers');

    const timerId = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerEl.innerText = timeLeft;
      } else {
        clearInterval(timerId);
        timerEl.innerText = "0";
        timerEl.style.background = "#172243";
        answersEl.style.pointerEvents = "none";
        answersEl.style.opacity = "0.5";
      }
    }, 1000);

    function submitVote(choice, button) {
      clearInterval(timerId);
      const confirmation = document.getElementById('confirmation');
      confirmation.style.background = getComputedStyle(button).backgroundColor;
      document.getElementById('chosen-icon').innerHTML = button.querySelector('svg').outerHTML;
      answersEl.style.display = 'none';
      document.getElementById('page-header').style.display = 'none';
      confirmation.style.display = 'flex';
    }
  </script>
</body>
</html>
