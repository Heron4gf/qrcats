<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spot the Sick Cat</title>
  <style>
    :root {
      --bg: #eeeeee;
      --navy: #172243;
      --accent: #4b71c0;
      --red: #e21b3c;
      --blue: #4b71c0;
      --dark: #172243;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: var(--bg);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      gap: 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.1;
    }
    #yarn-track {
      position: relative;
      height: 80px;
    }
    #title {
      position: absolute;
      top: 50%;
      left: 0;
      white-space: nowrap;
      transform-origin: left center;
      transform: translateY(-50%);
    }
    #thread {
      position: absolute;
      top: 50%;
      right: 0;
      height: 4px;
      margin-top: 22px;
      border-radius: 2px;
      background: var(--red);
    }
    #yarn {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #yarn svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #timer {
      position: relative;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
    }
    #answers {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .answer {
      flex: 1;
      min-height: 90px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      font-size: 1.8rem;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease;
    }
    .answer:active {
      transform: scale(0.97);
    }
    .answer svg {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      fill: #ffffff;
    }
    .answer img {
      align-self: stretch;
      height: auto;
      width: auto;
      aspect-ratio: 1 / 1;
      max-width: 50%;
      margin: 14px -10px 20px auto;
      flex-shrink: 0;
      border-radius: 8px;
      border: 4px solid #ffffff;
      object-fit: cover;
    }
    .red { background: var(--red); }
    .blue { background: var(--blue); }
    .dark { background: var(--dark); }
    @media (min-width: 768px) {
      h1 { font-size: 2.4rem; }
      #answers { flex-direction: row; }
      .answer { justify-content: center; }
    }
    #confirmation {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      color: #ffffff;
      margin: -16px;
      padding: 32px 16px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #confirmation svg {
      width: 96px;
      height: 96px;
      fill: #ffffff;
    }
    #confirmation h2 {
      font-size: 2rem;
      font-weight: 900;
    }
    #confirmation p {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header id="page-header">
    <div id="yarn-track">
      <h1 id="title">Which cat is sick?</h1>
      <div id="thread"></div>
      <div id="yarn">
        <svg viewBox="0 0 100 100">
          <defs><clipPath id="ball"><circle cx="50" cy="50" r="48"/></clipPath></defs>
          <circle cx="50" cy="50" r="48" fill="#e21b3c"/>
          <g clip-path="url(#ball)" fill="none" stroke="#a3112a" stroke-width="4">
            <path d="M-5 30 C30 10 70 10 105 30"/>
            <path d="M-5 48 C30 28 70 28 105 48"/>
            <path d="M-5 66 C30 46 70 46 105 66"/>
            <path d="M25 -5 C5 30 5 70 25 105"/>
            <path d="M45 -5 C25 30 25 70 45 105"/>
            <path d="M75 -5 C95 30 95 70 75 105"/>
          </g>
          <circle cx="50" cy="50" r="47" fill="none" stroke="#a3112a" stroke-width="3"/>
        </svg>
        <span id="timer">60</span>
      </div>
    </div>
  </header>

  <div id="answers">
    <button class="answer red" onclick="submitVote('A', this)">
      <svg viewBox="0 0 100 100"><path d="M50 5 L95 90 L5 90 Z"/></svg>
      Cat A
      <img src="thumb1.jpg" alt="">
    </button>
    <button class="answer blue" onclick="submitVote('B', this)">
      <svg viewBox="0 0 100 100"><path d="M50 0 L100 50 L50 100 L0 50 Z"/></svg>
      Cat B
      <img src="thumb2.jpg" alt="">
    </button>
    <button class="answer dark" onclick="submitVote('C', this)">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>
      Cat C
      <img src="thumb3.jpg" alt="">
    </button>
  </div>

  <div id="confirmation">
    <div id="chosen-icon"></div>
    <h2>Answer locked in!</h2>
    <p>Look at the main screen for the reveal 👀</p>
  </div>

  <script>
    const DURATION = 60;
    const MAX_SIZE = 72;
    const MIN_SIZE = 44;
    const timerEl = document.getElementById('timer');
    const answersEl = document.getElementById('answers');
    const trackEl = document.getElementById('yarn-track');
    const yarnEl = document.getElementById('yarn');
    const yarnSvg = yarnEl.querySelector('svg');
    const threadEl = document.getElementById('thread');
    const titleEl = document.getElementById('title');
    const start = performance.now();
    let frameId;

    // The ball starts on the right and rolls left, shrinking and leaving thread behind it.
    function drawYarn(progress) {
      const size = MAX_SIZE - (MAX_SIZE - MIN_SIZE) * progress;
      const travel = trackEl.clientWidth - MAX_SIZE;
      const left = (trackEl.clientWidth - size) - travel * progress;
      yarnEl.style.width = yarnEl.style.height = size + 'px';
      yarnEl.style.left = left + 'px';
      threadEl.style.left = (left + size / 2) + 'px';
      threadEl.style.marginTop = (size / 2 - 4) + 'px';
      const rolled = travel * progress / (MAX_SIZE / 2);
      yarnSvg.style.transform = 'rotate(' + (-rolled * 180 / Math.PI) + 'deg)';

      // Once the ball reaches the title it squashes it against the left edge.
      const squash = Math.max(0, Math.min(1, (left - 6) / titleEl.offsetWidth));
      const stretch = 1 + (1 - squash) * 0.35;
      titleEl.style.transform = 'translateY(-50%) scale(' + squash + ', ' + stretch + ')';
    }

    function tick(now) {
      const elapsed = Math.min((now - start) / 1000, DURATION);
      drawYarn(elapsed / DURATION);
      timerEl.innerText = Math.ceil(DURATION - elapsed);
      if (elapsed < DURATION) {
        frameId = requestAnimationFrame(tick);
      } else {
        answersEl.style.pointerEvents = "none";
        answersEl.style.opacity = "0.5";
      }
    }
    frameId = requestAnimationFrame(tick);

    function submitVote(choice, button) {
      cancelAnimationFrame(frameId);
      const confirmation = document.getElementById('confirmation');
      confirmation.style.background = getComputedStyle(button).backgroundColor;
      document.getElementById('chosen-icon').innerHTML = button.querySelector('svg').outerHTML;
      answersEl.style.display = 'none';
      document.getElementById('page-header').style.display = 'none';
      confirmation.style.display = 'flex';
    }
  </script>
</body>
</html>
