<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spot the Sick Cat</title>
  <style>
    :root {
      --bg: #eeeeee;
      --navy: #172243;
      --accent: #4b71c0;
      --red: #e21b3c;
      --blue: #4b71c0;
      --dark: #172243;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: var(--bg);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      gap: 16px;
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.1;
    }
    #yarn-track {
      position: relative;
      height: 80px;
    }
    #title {
      position: absolute;
      top: 50%;
      left: 0;
      white-space: nowrap;
      transform-origin: left center;
      transform: translateY(-50%);
    }
    #thread {
      position: absolute;
      top: 50%;
      right: 0;
      height: 4px;
      margin-top: 22px;
      border-radius: 2px;
      background: var(--red);
    }
    #yarn {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #yarn svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #timer {
      position: relative;
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
    }
    /* The cat that pops up at zero, staring at the yarn ball. */
    #cat {
      position: absolute;
      top: 50%;
      left: 0;
      width: 92px;
      height: 78px;
      margin-top: -39px;
      display: none;
      overflow: visible;
      cursor: pointer;
      transform-origin: 50% 100%;
      animation: catPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #cat.show { display: block; }
    #cat.pet { animation: catSquish 0.4s ease; }
    @keyframes catSquish {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.12, 0.86); }
      70% { transform: scale(0.95, 1.06); }
    }
    #meow {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 10;
      padding: 10px 16px;
      border-radius: 14px;
      background: #ffffff;
      color: var(--navy);
      box-shadow: 0 6px 18px rgba(23, 34, 67, 0.25);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-6px) scale(0.8);
      transform-origin: 46px 0;
      transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #meow::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 38px;
      border: 8px solid transparent;
      border-top: 0;
      border-bottom-color: #ffffff;
    }
    #meow.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    #meow strong {
      display: block;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--red);
    }
    #cat .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: catBlink 3.2s 1.2s infinite;
    }
    #cat .pupil {
      transform-box: fill-box;
      transform-origin: center;
      animation: catDilate 0.9s 0.35s ease-out both, catGlance 4.8s 1.6s ease-in-out infinite;
    }
    #cat .ear-l {
      transform-box: fill-box;
      transform-origin: 70% 100%;
      animation: catTwitch 2.6s 0.9s infinite;
    }
    @keyframes catPop {
      0% { opacity: 0; transform: translateY(26px) scale(0.2) rotate(-18deg); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }
    @keyframes catBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes catDilate {
      from { transform: scale(0.45, 0.6); }
      to { transform: scale(1); }
    }
    @keyframes catGlance {
      0%, 70%, 100% { translate: 0 0; }
      78%, 90% { translate: -3px 1px; }
    }
    @keyframes catTwitch {
      0%, 88%, 100% { transform: rotate(0); }
      91% { transform: rotate(-12deg); }
      94% { transform: rotate(4deg); }
    }
    #answers {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    .answer {
      flex: 1;
      min-height: 90px;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      font-size: 1.8rem;
      white-space: nowrap;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease;
    }
    .answer:active {
      transform: scale(0.97);
    }
    .answer svg {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      fill: #ffffff;
    }
    .answer img {
      align-self: stretch;
      height: auto;
      width: auto;
      aspect-ratio: 1 / 1;
      max-width: 50%;
      margin: 14px -10px 20px auto;
      flex-shrink: 0;
      border-radius: 8px;
      border: 4px solid #ffffff;
      object-fit: cover;
    }
    .red { background: var(--red); }
    .blue { background: var(--blue); }
    .dark { background: var(--dark); }
    @media (min-width: 768px) {
      h1 { font-size: 2.4rem; }
      #answers { flex-direction: row; }
      .answer { justify-content: center; }
    }
    #confirmation {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      color: #ffffff;
      margin: -16px;
      padding: 32px 16px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #confirmation svg {
      width: 96px;
      height: 96px;
      fill: #ffffff;
    }
    #confirmation h2 {
      font-size: 2rem;
      font-weight: 900;
    }
    #confirmation p {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.5;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header id="page-header">
    <div id="yarn-track">
      <h1 id="title">Which cat is sick?</h1>
      <div id="thread"></div>
      <div id="yarn">
        <svg viewBox="0 0 100 100">
          <defs><clipPath id="ball"><circle cx="50" cy="50" r="48"/></clipPath></defs>
          <circle cx="50" cy="50" r="48" fill="#e21b3c"/>
          <g clip-path="url(#ball)" fill="none" stroke="#a3112a" stroke-width="4">
            <path d="M-5 30 C30 10 70 10 105 30"/>
            <path d="M-5 48 C30 28 70 28 105 48"/>
            <path d="M-5 66 C30 46 70 46 105 66"/>
            <path d="M25 -5 C5 30 5 70 25 105"/>
            <path d="M45 -5 C25 30 25 70 45 105"/>
            <path d="M75 -5 C95 30 95 70 75 105"/>
          </g>
          <circle cx="50" cy="50" r="47" fill="none" stroke="#a3112a" stroke-width="3"/>
        </svg>
        <span id="timer">30</span>
      </div>
      <svg id="cat" viewBox="0 0 120 100" aria-label="Cat face">
        <!-- ears (drawn behind the head so the bases blend in) -->
        <g class="ear-l">
          <path d="M18 46 L16 6 L52 28 Z" fill="#172243" stroke="#172243" stroke-width="8" stroke-linejoin="round"/>
          <path d="M23 36 L22 16 L41 28 Z" fill="#e21b3c" stroke="#e21b3c" stroke-width="3" stroke-linejoin="round"/>
        </g>
        <path d="M102 46 L104 6 L68 28 Z" fill="#172243" stroke="#172243" stroke-width="8" stroke-linejoin="round"/>
        <path d="M97 36 L98 16 L79 28 Z" fill="#e21b3c" stroke="#e21b3c" stroke-width="3" stroke-linejoin="round"/>
        <!-- head -->
        <path d="M60 22 C92 22 110 40 110 62 C110 84 88 96 60 96 C32 96 10 84 10 62 C10 40 28 22 60 22 Z" fill="#172243"/>
        <!-- forehead stripes -->
        <g stroke="#2c3b6b" stroke-width="4" stroke-linecap="round">
          <path d="M60 26 L60 38"/>
          <path d="M51 28 L53 37"/>
          <path d="M69 28 L67 37"/>
        </g>
        <!-- blush -->
        <ellipse cx="25" cy="76" rx="8" ry="5" fill="#e21b3c" opacity="0.55"/>
        <ellipse cx="95" cy="76" rx="8" ry="5" fill="#e21b3c" opacity="0.55"/>
        <!-- eyes, pupils looking right at the yarn -->
        <g class="eye">
          <ellipse cx="40" cy="58" rx="14" ry="15" fill="#ffffff"/>
          <ellipse class="pupil" cx="45" cy="59" rx="8" ry="11" fill="#0b1124"/>
          <circle cx="42" cy="53" r="3.6" fill="#ffffff"/>
          <circle cx="48" cy="64" r="1.6" fill="#ffffff"/>
        </g>
        <g class="eye">
          <ellipse cx="80" cy="58" rx="14" ry="15" fill="#ffffff"/>
          <ellipse class="pupil" cx="85" cy="59" rx="8" ry="11" fill="#0b1124"/>
          <circle cx="82" cy="53" r="3.6" fill="#ffffff"/>
          <circle cx="88" cy="64" r="1.6" fill="#ffffff"/>
        </g>
        <!-- nose and mouth -->
        <path d="M54 73 L66 73 L60 80 Z" fill="#ff8fa3" stroke="#ff8fa3" stroke-width="3" stroke-linejoin="round"/>
        <path d="M60 80 Q60 87 52 86 M60 80 Q60 87 68 86" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
        <!-- whiskers -->
        <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
          <path d="M30 76 L-4 70"/>
          <path d="M30 81 L-2 84"/>
          <path d="M90 76 L124 70"/>
          <path d="M90 81 L122 84"/>
        </g>
      </svg>
      <div id="meow"><strong>Meow!</strong></div>
    </div>
  </header>

  <div id="answers">
    <button class="answer red" onclick="submitVote('A', this)">
      <svg viewBox="0 0 100 100"><path d="M50 5 L95 90 L5 90 Z"/></svg>
      Cat A
      <img src="thumb1.jpg" alt="">
    </button>
    <button class="answer blue" onclick="submitVote('B', this)">
      <svg viewBox="0 0 100 100"><path d="M50 0 L100 50 L50 100 L0 50 Z"/></svg>
      Cat B
      <img src="thumb2.jpg" alt="">
    </button>
    <button class="answer dark" onclick="submitVote('C', this)">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>
      Cat C
      <img src="thumb3.jpg" alt="">
    </button>
  </div>

  <div id="confirmation">
    <div id="chosen-icon"></div>
    <h2>Answer locked in!</h2>
    <p>Look at the main screen for the reveal 👀</p>
  </div>

  <script>
    const DURATION = 30;
    const MAX_SIZE = 72;
    const MIN_SIZE = 44;
    // Space kept free on the left so the cat can sit there when time runs out.
    const CAT_ROOM = 80;
    const timerEl = document.getElementById('timer');
    const answersEl = document.getElementById('answers');
    const trackEl = document.getElementById('yarn-track');
    const yarnEl = document.getElementById('yarn');
    const yarnSvg = yarnEl.querySelector('svg');
    const threadEl = document.getElementById('thread');
    const titleEl = document.getElementById('title');
    const start = performance.now();
    let frameId;

    // The ball starts on the right and rolls left, shrinking and leaving thread behind it.
    function drawYarn(progress) {
      const size = MAX_SIZE - (MAX_SIZE - MIN_SIZE) * progress;
      const travel = trackEl.clientWidth - MAX_SIZE - CAT_ROOM;
      const left = (trackEl.clientWidth - size) - travel * progress;
      yarnEl.style.width = yarnEl.style.height = size + 'px';
      yarnEl.style.left = left + 'px';
      threadEl.style.left = (left + size / 2) + 'px';
      threadEl.style.marginTop = (size / 2 - 4) + 'px';
      const rolled = travel * progress / (MAX_SIZE / 2);
      yarnSvg.style.transform = 'rotate(' + (-rolled * 180 / Math.PI) + 'deg)';

      // Once the ball reaches the title it squashes it against the left edge.
      const squash = Math.max(0, Math.min(1, (left - 6) / titleEl.offsetWidth));
      const stretch = 1 + (1 - squash) * 0.35;
      titleEl.style.transform = 'translateY(-50%) scale(' + squash + ', ' + stretch + ')';
    }

    function tick(now) {
      const elapsed = Math.min((now - start) / 1000, DURATION);
      drawYarn(elapsed / DURATION);
      timerEl.innerText = Math.ceil(DURATION - elapsed);
      if (elapsed < DURATION) {
        frameId = requestAnimationFrame(tick);
      } else {
        // Time's up: the squashed title is gone and a cat pops up to stare at the yarn.
        titleEl.style.display = 'none';
        catEl.classList.add('show');
        answersEl.style.pointerEvents = "none";
        answersEl.style.opacity = "0.5";
      }
    }
    frameId = requestAnimationFrame(tick);

    const catEl = document.getElementById('cat');
    const meowEl = document.getElementById('meow');
    let meowTimeout, audioCtx;

    // A tiny synthesized "meow": a nasal tone that rises, then falls.
    function playMeow() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(480, t);
        osc.frequency.exponentialRampToValueAtTime(820, t + 0.18);
        osc.frequency.exponentialRampToValueAtTime(420, t + 0.6);
        filter.type = 'lowpass';
        filter.Q.value = 6;
        filter.frequency.setValueAtTime(900, t);
        filter.frequency.exponentialRampToValueAtTime(2200, t + 0.2);
        filter.frequency.exponentialRampToValueAtTime(700, t + 0.6);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
        osc.connect(filter).connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.7);
      } catch (e) {}
    }

    catEl.addEventListener('click', () => {
      playMeow();
      catEl.classList.remove('pet');
      void catEl.offsetWidth;
      catEl.classList.add('pet');
      meowEl.classList.add('show');
      clearTimeout(meowTimeout);
      meowTimeout = setTimeout(() => meowEl.classList.remove('show'), 2500);
    });

    function submitVote(choice, button) {
      cancelAnimationFrame(frameId);
      const confirmation = document.getElementById('confirmation');
      confirmation.style.background = getComputedStyle(button).backgroundColor;
      document.getElementById('chosen-icon').innerHTML = button.querySelector('svg').outerHTML;
      answersEl.style.display = 'none';
      document.getElementById('page-header').style.display = 'none';
      confirmation.style.display = 'flex';
    }
  </script>
</body>
</html>
